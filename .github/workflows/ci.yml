name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pack-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pack, install the tarball in a fresh folder, run the stdio smoke test
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$(node -p 'require("path").resolve(process.env.RUNNER_TEMP, "langcoach-smoke").split(require("path").sep).join("/")')"
          mkdir -p "$SMOKE_DIR/pkg" "$SMOKE_DIR/install"
          npm pack -w langcoach --pack-destination "$SMOKE_DIR/pkg"
          TGZ="$(ls "$SMOKE_DIR"/pkg/langcoach-*.tgz)"
          cd "$SMOKE_DIR/install"
          npm init -y > /dev/null
          npm i --no-audit --no-fund "$TGZ"
          cd "$GITHUB_WORKSPACE"
          node scripts/smoke-stdio.mjs "$SMOKE_DIR/install"

  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run extension E2E tests against local LLL mock
        run: npm run test:e2e -w @langcoach/extension
      - name: Build production extension and package ZIP
        run: |
          npm run build -w @langcoach/extension
          npm run zip -w @langcoach/extension
      - uses: actions/upload-artifact@v4
        with:
          name: langcoach-extension
          path: apps/extension/langcoach-extension-*.zip
