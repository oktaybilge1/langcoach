<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="LangCoach: your AI agent remembers every Little Language Lessons lesson, plans your week and schedules reviews">
  <defs>
    <pattern id="rules" width="960" height="28" patternUnits="userSpaceOnUse">
      <rect width="960" height="28" fill="#faf7f2"/>
      <rect y="27" width="960" height="1" fill="#efe7da"/>
    </pattern>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <clipPath id="page"><rect width="960" height="420" rx="24"/></clipPath>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #292524; }
      .serif { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; }
      .muted { fill: #6b5d4f; }
      .card { fill: #fff; stroke: #eadfcd; }
      .in { opacity: 0; animation: in .6s ease-out forwards; }
      .d1 { animation-delay: .3s } .d2 { animation-delay: 1.1s } .d3 { animation-delay: 1.9s }
      .d4 { animation-delay: 2.7s } .d5 { animation-delay: 3.5s } .d6 { animation-delay: 4.3s }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .flicker { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.4s ease-in-out infinite; }
      @keyframes flick { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08,1.12) } }
      .ring { stroke-dasharray: 251; stroke-dashoffset: 251; animation: ring 2.2s 1.2s ease-out forwards; }
      @keyframes ring { to { stroke-dashoffset: 100 } }
      .sticker { transform-box: fill-box; transform-origin: center; animation: pop .5s 4.8s ease-out both; }
      @keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: none; opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 100 !important; } }
    </style>
  </defs>
  <g clip-path="url(#page)">
    <rect width="960" height="420" fill="url(#rules)"/>
    <rect x="30" width="1.5" height="420" fill="#f3c7c7"/>
  </g>
  <rect x=".5" y=".5" width="959" height="419" rx="24" fill="none" stroke="#eadfcd"/>

  <text x="56" y="76" font-size="46" class="serif">LangCoach</text>
  <text x="58" y="108" font-size="18" class="muted">Your AI agent remembers every Little Language Lessons lesson.</text>

  <!-- conversation in Claude Code -->
  <g transform="translate(56,140)">
    <rect y="3" width="560" height="246" rx="14" fill="#eadfcd"/>
    <rect class="card" width="560" height="246" rx="14"/>
    <circle cx="20" cy="18" r="5" fill="#fca5a5"/><circle cx="38" cy="18" r="5" fill="#fcd34d"/><circle cx="56" cy="18" r="5" fill="#86efac"/>
    <text x="280" y="22" font-size="11" class="mono muted" text-anchor="middle">claude</text>
    <line x1="0" x2="560" y1="34" y2="34" stroke="#efe7da"/>
    <g class="mono" font-size="14">
      <text x="20" y="66" fill="#c2410c" class="in d1">&gt; what should I study today?</text>
      <text x="20" y="98" class="in d2">I saw your Tiny Lesson "at the pharmacy" on LLL.</text>
      <text x="20" y="122" class="in d3">15 new words saved · 11 reviews due · 5-day streak 🔥</text>
      <text x="20" y="154" fill="#9a3412" class="in d4">Quick review: how do you say "the bill, please"?</text>
      <text x="20" y="186" fill="#c2410c" class="in d5">&gt; la cuenta, por favor</text>
      <text x="20" y="218" fill="#166534" class="in d6">✓ Correct. Next review in 4 days. +10 XP</text>
      <rect x="20" y="228" width="9" height="16" fill="#c2410c" class="blink"/>
    </g>
  </g>

  <!-- streak tile -->
  <g transform="translate(648,140)">
    <rect y="3" width="262" height="104" rx="14" fill="#eadfcd"/>
    <rect width="262" height="104" rx="14" fill="#fff1e0" stroke="#eadfcd"/>
    <path class="flicker" d="M50 22 c-18 18 -26 34 -16 52 c8 13 28 13 36 0 c8 -13 3 -26 -5 -34 c0 10 -5 16 -10 16 c5 -13 0 -24 -5 -34 z" fill="url(#flame)"/>
    <text x="100" y="48" font-size="30" font-weight="800">5 days</text>
    <text x="100" y="74" font-size="14" class="muted">streak · 203 XP this week</text>
  </g>

  <!-- weekly plan card -->
  <g transform="translate(648,266)">
    <rect y="3" width="262" height="120" rx="14" fill="#eadfcd"/>
    <rect class="card" width="262" height="120" rx="14"/>
    <circle cx="58" cy="60" r="40" fill="none" stroke="#f3ece1" stroke-width="10"/>
    <circle class="ring" cx="58" cy="60" r="40" fill="none" stroke="url(#xp)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 58 60)"/>
    <text x="58" y="66" font-size="16" font-weight="700" text-anchor="middle">3/5</text>
    <text x="116" y="54" font-size="16" font-weight="700">Weekly plan</text>
    <text x="116" y="78" font-size="13" class="muted">3 of 5 study days done</text>
  </g>

  <!-- level sticker -->
  <g transform="translate(836,52) rotate(-6)">
    <g class="sticker">
      <rect x="-62" y="-26" width="124" height="52" rx="8" fill="#e5c76b"/>
      <rect x="-62" y="-29" width="124" height="52" rx="8" fill="#fde68a"/>
      <text y="-6" font-size="16" font-weight="800" text-anchor="middle">Level 3 ⭐</text>
      <text y="13" font-size="12" font-weight="600" text-anchor="middle">Learner · 237 XP</text>
    </g>
  </g>
</svg>
