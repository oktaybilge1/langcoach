<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="LangCoach: your AI agent remembers every Little Language Lessons lesson, plans your week and schedules reviews">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <style>
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; }
      .in { opacity: 0; animation: in .6s ease-out forwards; }
      .d1 { animation-delay: .3s } .d2 { animation-delay: 1.1s } .d3 { animation-delay: 1.9s }
      .d4 { animation-delay: 2.7s } .d5 { animation-delay: 3.5s } .d6 { animation-delay: 4.3s }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .flicker { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.4s ease-in-out infinite; }
      @keyframes flick { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08,1.12) } }
      .ring { stroke-dasharray: 251; stroke-dashoffset: 251; animation: ring 2.2s 1.2s ease-out forwards; }
      @keyframes ring { to { stroke-dashoffset: 70 } }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 70 !important; } }
    </style>
  </defs>
  <rect width="960" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="900" cy="40" r="140" fill="#6366f1" opacity=".12"/>
  <circle cx="60" cy="400" r="160" fill="#3b82f6" opacity=".10"/>

  <text x="48" y="78" font-size="44" font-weight="800" fill="#fff">Lang<tspan fill="url(#accent)">Coach</tspan></text>
  <text x="48" y="112" font-size="18" fill="#cbd5e1">Your AI agent remembers every Little Language Lessons lesson.</text>

  <!-- terminal -->
  <g transform="translate(48,140)">
    <rect width="560" height="246" rx="14" fill="#020617" stroke="#334155"/>
    <circle cx="20" cy="18" r="5" fill="#f87171"/><circle cx="38" cy="18" r="5" fill="#fbbf24"/><circle cx="56" cy="18" r="5" fill="#34d399"/>
    <text x="280" y="22" font-size="11" fill="#64748b" text-anchor="middle" class="mono">claude</text>
    <g class="mono" font-size="14">
      <text x="20" y="62" fill="#93c5fd" class="in d1">&gt; what should I study today?</text>
      <text x="20" y="94" fill="#e2e8f0" class="in d2">I saw your Tiny Lesson "ordering at a café" on LLL.</text>
      <text x="20" y="118" fill="#e2e8f0" class="in d3">12 new cards added · 8 reviews due · 5-day streak 🔥</text>
      <text x="20" y="150" fill="#c4b5fd" class="in d4">Quick review: how do you say "the bill, please"?</text>
      <text x="20" y="182" fill="#93c5fd" class="in d5">&gt; la cuenta, por favor</text>
      <text x="20" y="214" fill="#86efac" class="in d6">✓ Correct. Next review in 4 days. +10 XP</text>
      <rect x="20" y="224" width="9" height="16" fill="#93c5fd" class="blink"/>
    </g>
  </g>

  <!-- side cards -->
  <g class="float">
    <g transform="translate(650,150)">
      <rect width="262" height="104" rx="14" fill="#1e293b" stroke="#334155"/>
      <path class="flicker" d="M50 22 c-18 18 -26 34 -16 52 c8 13 28 13 36 0 c8 -13 3 -26 -5 -34 c0 10 -5 16 -10 16 c5 -13 0 -24 -5 -34 z" fill="url(#flame)"/>
      <text x="100" y="44" font-size="30" font-weight="800" fill="#fff">5 days</text>
      <text x="100" y="70" font-size="14" fill="#94a3b8">streak · 240 XP this week</text>
    </g>
    <g transform="translate(650,272)">
      <rect width="262" height="114" rx="14" fill="#1e293b" stroke="#334155"/>
      <circle cx="58" cy="57" r="40" fill="none" stroke="#334155" stroke-width="10"/>
      <circle class="ring" cx="58" cy="57" r="40" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 58 57)"/>
      <text x="58" y="63" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3/4</text>
      <text x="116" y="50" font-size="16" font-weight="700" fill="#fff">Weekly plan</text>
      <text x="116" y="74" font-size="13" fill="#94a3b8">FSRS reviews · Anki export</text>
    </g>
  </g>
</svg>
