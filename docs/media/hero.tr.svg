<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="LangCoach: Little Language Lessons artık hafızalı. 5 günlük seri, 90 kayıtlı kelime ve XP çubuğu olan bir defter.">
  <defs>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".7" fill="#ffffff" opacity=".05"/></pattern>
    <pattern id="tapeA" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fb923c"/><rect width="4" height="10" fill="#fdba74"/></pattern>
    <pattern id="tapeB" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#86efac"/><circle cx="4" cy="4" r="1.6" fill="#dcfce7"/></pattern>
    <linearGradient id="xp" x1="0" x2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".28"/></filter>
    <pattern id="rules" width="10" height="32" patternUnits="userSpaceOnUse" y="6"><rect width="10" height="32" fill="#faf7f2"/><rect y="31" width="10" height="1" fill="#efe7da"/></pattern>
    <linearGradient id="spine" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <clipPath id="bubble"><rect x="652" y="122" width="406" height="66" rx="12"/></clipPath>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif; fill: #292524; }
      .serif { font-family: Georgia, &quot;Times New Roman&quot;, serif; font-style: italic; }
      .emoji { font-family: &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Noto Color Emoji&quot;, sans-serif; }
      .swoosh { stroke-dasharray: 420; animation: draw 1s .3s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 420 } to { stroke-dashoffset: 0 } }
      .typer { transform: translateX(400px); animation: type 1.54s 1s steps(22) both; }
      @keyframes type { from { transform: none } to { transform: translateX(400px) } }
      .caret { opacity: 0; animation: caret 2.14s 1s steps(1) both; }
      @keyframes caret { 0%,20%,40%,60%,80% { opacity: 1 } 10%,30%,50%,70%,90%,100% { opacity: 0 } }
      .flicker { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.6s ease-in-out infinite; }
      @keyframes flick { 0%,100% { transform: none } 40% { transform: scale(1.06,1.13) rotate(-2deg) } 70% { transform: scale(.97,1.04) rotate(2deg) } }
      .bar { transform-box: fill-box; transform-origin: 0 50%; animation: fill 1.4s 2.5s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes fill { from { transform: scaleX(0) } to { transform: none } }
      .pop { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; }
      @keyframes pop { from { opacity: 0; transform: scale(.3) rotate(-18deg) } to { opacity: 1; transform: none } }
      .s1 { animation-delay: 3.1s } .s2 { animation-delay: 3.4s } .s3 { animation-delay: 3.7s } .s4 { animation-delay: 4s }
      @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
    </style>
  </defs>
  
  <rect width="1200" height="600" rx="28" fill="#2f4a3f"/>
  <rect width="1200" height="600" rx="28" fill="url(#grain)"/>
  <rect x="14" y="14" width="1172" height="572" rx="18" fill="none" stroke="#f5efe4" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- open notebook -->
  <rect x="96" y="76" width="1008" height="468" rx="12" fill="#000" opacity=".3" transform="translate(0,8)"/>
  <rect x="90" y="70" width="1020" height="468" rx="12" fill="#e9dfcf"/>
  <rect x="96" y="66" width="1008" height="468" rx="10" fill="url(#rules)"/>
  <rect x="146" y="66" width="1.5" height="468" fill="#f3c7c7"/>
  <rect x="560" y="66" width="80" height="468" fill="url(#spine)"/>
  <rect x="599.5" y="66" width="1" height="468" fill="#d9ccb8"/>

  <!-- washi tape -->
  <rect x="70" y="52" width="150" height="34" fill="url(#tapeA)" opacity=".85" transform="rotate(-14 145 69)"/>
  <rect x="990" y="50" width="140" height="32" fill="url(#tapeB)" opacity=".85" transform="rotate(12 1060 66)"/>

  <!-- left page: wordmark, tagline, words -->
  <text x="156" y="206" font-size="70" font-weight="700" class="serif" letter-spacing="-1">LangCoach</text>
  <path class="swoosh" d="M164 230 C 260 218, 380 216, 520 224 C 450 228, 370 234, 296 246" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="300" font-size="25" class="serif" fill="#6b5d4f">Little Language Lessons</text>
  <text x="160" y="332" font-size="25" class="serif" fill="#6b5d4f">artık hafızalı.</text>
  
    <text x="160" y="404" font-size="19"><tspan font-weight="700">la cuenta</tspan><tspan dx="10" fill="#6b5d4f">hesap</tspan></text>
    <rect x="460.4" y="386" width="99.60000000000001" height="24" rx="12" fill="#dcfce7"/>
    <text x="510.2" y="403" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">öğrenildi</text>
    <text x="160" y="444" font-size="19"><tspan font-weight="700">el horario</tspan><tspan dx="10" fill="#6b5d4f">çalışma saatleri</tspan></text>
    <rect x="460.4" y="426" width="99.60000000000001" height="24" rx="12" fill="#dcfce7"/>
    <text x="510.2" y="443" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">öğrenildi</text>
    <text x="160" y="484" font-size="19"><tspan font-weight="700">la receta</tspan><tspan dx="10" fill="#6b5d4f">reçete</tspan></text>
    <rect x="485.6" y="466" width="74.4" height="24" rx="12" fill="#ffe4e6"/>
    <text x="522.8" y="483" font-size="13" font-weight="700" fill="#9f1239" text-anchor="middle">tekrar</text>

  <!-- right page: chat line, tiles, XP bar -->
  <rect x="650" y="123" width="410" height="70" rx="14" fill="#eadfcd"/>
  <rect x="650" y="120" width="410" height="70" rx="14" fill="#fff" stroke="#eadfcd"/>
  <path d="M676 190 l-8 16 l24 -16 z" fill="#fff" stroke="#eadfcd"/>
  <rect x="670" y="186" width="30" height="6" fill="#fff"/>
  <text x="676" y="166" font-size="27" font-weight="700">¡Hola! <tspan class="emoji" font-size="25">🔥</tspan> 5 günlük seri</text>
  <g clip-path="url(#bubble)"><g class="typer">
    <rect x="672" y="124" width="420" height="62" fill="#fff"/>
    <rect class="caret" x="674" y="140" width="3" height="32" fill="#c2410c"/>
  </g></g>

  <rect x="650" y="233" width="196" height="126" rx="14" fill="#eadfcd"/>
  <rect x="650" y="230" width="196" height="126" rx="14" fill="#fff1e0" stroke="#eadfcd"/>
  <path class="flicker" d="M694 262 c-20 20 -29 38 -18 58 c9 14 31 14 40 0 c9 -14 3 -29 -6 -38 c0 11 -5 18 -11 18 c6 -14 0 -27 -5 -38 z" fill="url(#flame)"/>
  <text x="742" y="300" font-size="44" font-weight="800">5</text>
  <text x="742" y="326" font-size="17" fill="#6b5d4f">günlük seri</text>

  <rect x="864" y="233" width="196" height="126" rx="14" fill="#eadfcd"/>
  <rect x="864" y="230" width="196" height="126" rx="14" fill="#eef6e8" stroke="#eadfcd"/>
  <text x="888" y="300" font-size="44" font-weight="800">90</text>
  <text x="888" y="326" font-size="17" fill="#6b5d4f">kayıtlı kelime</text>
  <g transform="translate(1014,276)"><rect x="-16" y="-20" width="32" height="40" rx="5" fill="#fff" stroke="#86b07a" stroke-width="2" transform="rotate(8)"/><rect x="-16" y="-20" width="32" height="40" rx="5" fill="#fff" stroke="#86b07a" stroke-width="2" transform="rotate(-6)"/><path d="M-7 1 l5 5 l10 -11" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>

  <text x="652" y="414" font-size="20" font-weight="800">Seviye 3</text>
  <text x="1058" y="414" font-size="16" font-weight="700" fill="#6b5d4f" text-anchor="end">237 XP</text>
  <rect x="650" y="428" width="410" height="20" rx="10" fill="#f3ece1" stroke="#eadfcd"/>
  <rect class="bar" x="650" y="428" width="300" height="20" rx="10" fill="url(#xp)"/>
  <text x="652" y="480" font-size="17" fill="#6b5d4f">Bu hafta 203 XP</text>

  <!-- stickers -->
  
  <g transform="translate(1062,110) rotate(-8)"><g class="pop s1">
    <rect x="-70" y="-31" width="140" height="62" rx="31" fill="#fff" filter="url(#drop)"/>
    <rect x="-64" y="-25" width="128" height="50" rx="25" fill="#fde68a"/>
    <text y="9.36" text-anchor="middle" font-size="26" font-weight="700" fill="#292524" class="serif">¡Hola!</text>
  </g></g>
  
  <g transform="translate(186,540) rotate(6)"><g class="pop s2">
    <rect x="-81" y="-30" width="162" height="60" rx="30" fill="#fff" filter="url(#drop)"/>
    <rect x="-75" y="-24" width="150" height="48" rx="24" fill="#dcfce7"/>
    <text y="8.64" text-anchor="middle" font-size="24" font-weight="700" fill="#292524" class="serif">Merhaba</text>
  </g></g>
  
  <g transform="translate(870,548) rotate(-5)"><g class="pop s3">
    <rect x="-75" y="-30" width="150" height="60" rx="30" fill="#fff" filter="url(#drop)"/>
    <rect x="-69" y="-24" width="138" height="48" rx="24" fill="#ffe4e6"/>
    <text y="8.64" text-anchor="middle" font-size="24" font-weight="700" fill="#292524" class="serif">Bonjour</text>
  </g></g>
  
  <g transform="translate(1050,494) rotate(9)"><g class="pop s4">
    <rect x="-54" y="-26" width="108" height="52" rx="26" fill="#fff" filter="url(#drop)"/>
    <rect x="-48" y="-20" width="96" height="40" rx="20" fill="#fed7aa"/>
    <text y="6.12" text-anchor="middle" font-size="17" font-weight="700" fill="#292524">+10 XP</text>
  </g></g>
</svg>
